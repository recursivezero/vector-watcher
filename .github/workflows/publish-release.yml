name: Publish Vector Watcher Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_linux:
    name: Build Linux
    uses: ./.github/workflows/build-linux.yml

  build_macos:
    name: Build macOS
    uses: ./.github/workflows/build-macos.yml

  build_windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml

  build_snap:
    name: Build Snap
    needs:
      - build_linux
    uses: ./.github/workflows/build-snap.yml

  publish:
    name: Publish GitHub Release
    needs:
      - build_linux
      - build_macos
      - build_windows
      - build_snap
    runs-on: ubuntu-24.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: vector-watcher-linux
          path: release/linux

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: vector-watcher-macos
          path: release/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: vector-watcher-windows
          path: release/windows

      - name: Download Snap artifact
        uses: actions/download-artifact@v5
        with:
          name: vector-watcher-snap
          path: release/snap

      - name: Verify release artifacts
        run: |
          echo "=== Linux ==="
          find release/linux -type f -exec ls -lh {} \;

          echo "=== macOS ==="
          find release/macos -type f -exec ls -lh {} \;

          echo "=== Windows ==="
          find release/windows -type f -exec ls -lh {} \;

          echo "=== Snap ==="
          find release/snap -type f -exec ls -lh {} \;

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FILES=$(find release -type f \( \
            -name "*.deb" -o \
            -name "*.AppImage" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.snap" \
          \))

          if [ -z "$RELEASE_FILES" ]; then
            echo "ERROR: No release installers were found."
            find release -type f -print
            exit 1
          fi

          echo "Release files:"
          echo "$RELEASE_FILES"

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Vector Watcher ${GITHUB_REF_NAME}" \
            --generate-notes \
            $RELEASE_FILES

      - name: Release Summary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Vector Watcher Release"
            echo
            echo "| Item | Details |"
            echo "|---|---|"
            echo "| Version | \`${RELEASE_TAG}\` |"
            echo "| Repository | \`${REPOSITORY}\` |"
            echo "| Status | Published successfully |"
            echo
            echo "### Platforms"
            echo
            echo "- **Linux** — .deb, AppImage"
            echo "- **macOS** — .dmg"
            echo "- **Windows** — .exe"
            echo
            echo "### Build Jobs"
            echo
            echo "- Linux: passed"
            echo "- macOS: passed"
            echo "- Windows: passed"
            echo
            echo "### Release"
            echo
            echo "GitHub Release \`${RELEASE_TAG}\` was created with generated release notes and all platform artifacts."
          } >> "$GITHUB_STEP_SUMMARY"
