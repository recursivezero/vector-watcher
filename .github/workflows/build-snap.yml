name: Build Linux Snap

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build Snap
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set release version
        shell: bash
        run: |
          set -eux

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "ERROR: Snap release build must be triggered by a tag."
            echo "GITHUB_REF_TYPE=${GITHUB_REF_TYPE}"
            echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Building Snap version: $VERSION"

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: vector-watcher-linux
          path: release/linux

      - name: Verify Linux artifact
        shell: bash
        run: |
          set -eux

          echo "Downloaded Linux artifacts:"
          find release/linux -type f -exec ls -lh {} \;

          DEB_COUNT=$(find release/linux \
            -type f \
            -name "*.deb" \
            | wc -l)

          if [ "$DEB_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one .deb, found $DEB_COUNT"
            find release/linux -type f -print
            exit 1
          fi

      - name: Prepare Snap input
        shell: bash
        run: |
          set -eux

          mkdir -p src-tauri/target/release/bundle/deb

          DEB_FILE=$(find release/linux \
            -type f \
            -name "*.deb" \
            -print \
            -quit)

          echo "Using Debian package:"
          echo "$DEB_FILE"

          cp "$DEB_FILE" \
            "src-tauri/target/release/bundle/deb/"

          echo "Snap input:"
          ls -lh src-tauri/target/release/bundle/deb/

      - name: Verify Snap input
        shell: bash
        run: |
          set -eux

          DEB_FILE=$(find src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            -print \
            -quit)

          test -n "$DEB_FILE"

          echo "Verifying:"
          echo "$DEB_FILE"

          dpkg-deb --info "$DEB_FILE"

      - name: Set Snap version
        shell: bash
        run: |
          set -eux

          sed -i \
            -E "s/^version:.*/version: '$VERSION'/" \
            snap/snapcraft.yaml

          echo "Snapcraft version:"
          grep '^version:' snap/snapcraft.yaml

      - name: Setup LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: 5.21/stable

      - name: Build Snap
        id: snapcraft
        uses: snapcore/action-build@v1

      - name: Verify Snap artifact
        shell: bash
        run: |
          set -eux

          echo "Snapcraft output:"
          echo "${{ steps.snapcraft.outputs.snap }}"

          test -f "${{ steps.snapcraft.outputs.snap }}"

          echo "Built Snap:"
          ls -lh "${{ steps.snapcraft.outputs.snap }}"

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: vector-watcher-snap
          path: ${{ steps.snapcraft.outputs.snap }}
