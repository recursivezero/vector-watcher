name: Build Vector Watcher

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Build backend sidecar
        run: |
          chmod +x backend/build.sh
          ./backend/build.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Linux application
        working-directory: frontend
        run: npm run tauri:build:linux

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb

  build-macos:
    name: macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Build backend sidecar
        run: |
          chmod +x backend/build.sh
          ./backend/build.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS application
        working-directory: frontend
        run: npm run tauri:build:mac

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        shell: powershell
        run: |
          pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        shell: powershell
        run: |
          poetry install --no-interaction

      - name: Build Windows backend sidecar
        working-directory: backend
        shell: powershell
        run: |
          .\build-windows.ps1

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: |
          npm ci

      - name: Build Windows application
        working-directory: frontend
        shell: powershell
        run: |
          npm run tauri:build:windows

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
