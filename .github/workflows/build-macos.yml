name: Build Vector Watcher - macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_macos:
    name: macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Build backend sidecar
        run: |
          chmod +x backend/build.sh
          ./backend/build.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build macOS application
        working-directory: frontend
        run: npm run tauri:build:mac

      - name: Verify application
        run: |
          set -euo pipefail

          APP="src-tauri/target/release/bundle/macos/vector-watcher.app"

          echo "Checking:"
          echo "$APP"

          test -d "$APP"
          test -f "$APP/Contents/MacOS/vector-watcher"
          test -f "$APP/Contents/MacOS/vector-watcher-backend"

          echo ""
          echo "Application:"
          ls -la "$APP/Contents"

          echo ""
          echo "Executables:"
          ls -lh "$APP/Contents/MacOS"

          echo ""
          echo "PyInstaller runtime:"
          ls -ld "$APP/Contents/Frameworks"

      - name: Upload macOS application
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg