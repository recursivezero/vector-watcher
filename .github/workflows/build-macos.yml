name: Build Vector Watcher - macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_macos:
    name: MacOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Build backend sidecar
        run: |
          chmod +x backend/build.sh
          ./backend/build.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: npm run tauri:build:mac

      - name: Re-sign macOS application
        run: |
          codesign --force --deep --sign - \
            frontend/src-tauri/target/release/bundle/macos/vector-watcher.app

          codesign --verify --deep --strict --verbose=4 \
            frontend/src-tauri/target/release/bundle/macos/vector-watcher.app

      - name: Recreate DMG
        run: |
          rm frontend/src-tauri/target/release/bundle/dmg/*.dmg

          hdiutil create \
            -volname "vector-watcher" \
            -srcfolder frontend/src-tauri/target/release/bundle/macos/vector-watcher.app \
            -ov \
            -format UDZO \
            frontend/src-tauri/target/release/bundle/dmg/vector-watcher_0.1.9_aarch64.dmg

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg