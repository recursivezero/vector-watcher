name: Build Vector Watcher - macOS

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build_macos:
    name: macOS Apple Silicon
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Build backend sidecar
        run: |
          chmod +x backend/build.sh
          ./backend/build.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build unsigned macOS application
        working-directory: frontend
        run: npm run tauri:build:mac

      - name: Ad-hoc sign macOS application
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          APP="$PWD/src-tauri/target/release/bundle/macos/vector-watcher.app"

          echo "========================================"
          echo "Ad-hoc signing Vector Watcher"
          echo "========================================"

          echo "APP=$APP"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Application bundle does not exist:"
            echo "$APP"
            exit 1
          fi

          echo "Application exists."

          echo ""
          echo "Main executable:"
          file "$APP/Contents/MacOS/vector-watcher"

          echo ""
          echo "Backend executable:"
          file "$APP/Contents/MacOS/vector-watcher-backend"

          echo ""
          echo "Signing backend..."

          /usr/bin/codesign \
            --force \
            --sign - \
            "$APP/Contents/MacOS/vector-watcher-backend"

          echo "Backend signed."

          echo ""
          echo "Signing main executable..."

          /usr/bin/codesign \
            --force \
            --sign - \
            "$APP/Contents/MacOS/vector-watcher"

          echo "Main executable signed."

          echo ""
          echo "Signing native libraries..."

          find "$APP/Contents" \
            -type f \
            \( -name "*.dylib" -o -name "*.so" \) \
            -print0 |
          while IFS= read -r -d '' FILE; do
            echo "Signing library: $FILE"

            /usr/bin/codesign \
              --force \
              --sign - \
              "$FILE"
          done

          echo ""
          echo "Signing application bundle..."

          /usr/bin/codesign \
            --force \
            --sign - \
            "$APP"

          echo ""
          echo "Verifying application..."

          /usr/bin/codesign \
            --verify \
            --verbose=4 \
            "$APP"

          echo ""
          echo "Ad-hoc signing completed successfully."

      - name: Create DMG
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          APP="src-tauri/target/release/bundle/macos/vector-watcher.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          STAGING="$RUNNER_TEMP/vector-watcher-dmg"

          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          mkdir -p "$DMG_DIR"

          cp -R "$APP" "$STAGING/"

          ln -s /Applications "$STAGING/Applications"

          rm -f "$DMG_DIR/vector-watcher_0.1.10_aarch64.dmg"

          hdiutil create \
            -volname "Vector Watcher" \
            -srcfolder "$STAGING" \
            -ov \
            -format UDZO \
            "$DMG_DIR/vector-watcher_0.1.10_aarch64.dmg"

          echo ""
          echo "DMG created:"
          ls -lh "$DMG_DIR"

      - name: Verify final application
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail

          APP="src-tauri/target/release/bundle/macos/vector-watcher.app"

          test -f "$APP/Contents/MacOS/vector-watcher"
          test -f "$APP/Contents/MacOS/vector-watcher-backend"

          echo "Application:"
          ls -lh "$APP/Contents/MacOS/"

          echo ""
          echo "Backend runtime:"
          ls -ld "$APP/Contents/Frameworks"

          echo ""
          echo "Final signature verification:"
          codesign --verify --verbose=4 "$APP"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: vector-watcher-macos
          path: |
            frontend/src-tauri/target/release/bundle/macos/*.app
            frontend/src-tauri/target/release/bundle/dmg/*.dmg