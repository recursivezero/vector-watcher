name: Sync docs to wiki

on:
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - "docs/**"

jobs:
  sync-wiki:
    name: Sync Docs to Wiki
    environment: wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Verify docs folder
        run: |
          if [ ! -d "docs" ]; then
            echo "::error:: The 'docs' directory does not exist in the root of the repository!"
            exit 1
          fi
          ls -la docs/

      - name: Sync docs to wiki
        env:
          WIKI_PAT: ${{ secrets.WIKI_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clone wiki
          git clone "https://x-access-token:${WIKI_PAT}@github.com/${{ github.repository }}.wiki.git" wiki_dir

          # Copy docs folder contents (including _Sidebar.md)
          rsync -av --delete --exclude='.git*' docs/ wiki_dir/

          # Map index.md to Home.md for GitHub Wiki entrypoint
          if [ -f "wiki_dir/index.md" ]; then
            cp wiki_dir/index.md wiki_dir/Home.md
          fi

          cd wiki_dir

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "docs: sync from main branch"
            git push origin HEAD
            echo "Successfully updated Wiki!"
          else
            echo "No changes to sync."
          fi
