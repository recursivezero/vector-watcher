[project]
name = "vector-watcher-backend"
version = "0.1.0"
description = "Local LanceDb backend for vector Watcher"
authors = [
    {name = "admin",email = "recursivezero@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "lancedb (>=0.37.1,<0.38.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "httpx2 (>=2.12.0,<3.0.0)"
]
