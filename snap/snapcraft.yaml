name: vector-watcher
title: Vector Watcher
version: 0.1.7
summary: Desktop explorer for LanceDB vector datasets
description: |
  Vector Watcher is a desktop application for connecting to,
  exploring, and inspecting LanceDB vector datasets.

  It provides a native desktop interface built with Tauri and
  includes a bundled Python backend powered by LanceDB,
  PyArrow, and NumPy.
base: core24
grade: stable
confinement: strict

platforms:
  amd64:
    build-on:
      - amd64
    build-for:
      - amd64

layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET/webkit2gtk-4.1

parts:
  vector-watcher:
    plugin: nil

    build-packages:
      - dpkg

    stage-packages:
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0


    override-build: |
      set -eux

      DEB_FILE=$(find "$CRAFT_PROJECT_DIR/src-tauri/target/release/bundle/deb" \
        -maxdepth 1 \
        -type f \
        -name "*.deb" \
        -print \
        -quit)

      test -n "$DEB_FILE"

      echo "Using Debian package:"
      echo "$DEB_FILE"

      dpkg -x \
        "$DEB_FILE" \
        "$CRAFT_PART_INSTALL"

      # Tauri starts the packaged backend as a sidecar by the
      # externalBin name vector-watcher-backend. The Debian artifact
      # places that executable in usr/bin, but the Tauri runtime
      # launcher resolves a binaries/ tree during a production bundle.
      # Mirror the requested sidecar shape inside the Snap payload so
      # the app can start the Python backend during a Snap launch.
      mkdir -p "$CRAFT_PART_INSTALL/binaries"

      if [ -f "$CRAFT_PART_INSTALL/usr/bin/vector-watcher-backend" ]; then
        cp -a "$CRAFT_PART_INSTALL/usr/bin/vector-watcher-backend" \
          "$CRAFT_PART_INSTALL/binaries/vector-watcher-backend"
        chmod +x "$CRAFT_PART_INSTALL/binaries/vector-watcher-backend"
      fi

      if [ -d "$CRAFT_PART_INSTALL/usr/bin/_internal" ]; then
        rm -rf "$CRAFT_PART_INSTALL/binaries/_internal"
        cp -a "$CRAFT_PART_INSTALL/usr/bin/_internal" \
          "$CRAFT_PART_INSTALL/binaries/_internal"
      fi

apps:
  vector-watcher:
    command: usr/bin/vector-watcher

    desktop: usr/share/applications/vector-watcher.desktop

    extensions:
      - gpu

    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-bind
      - browser-support
      - opengl
      - wayland
      - x11